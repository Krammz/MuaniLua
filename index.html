<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload Public Simple</title>
  <style>
    body { font-family: Arial; text-align:center; padding:40px; background:#f4f4f4; }
    .box { background:#fff; padding:20px; border-radius:10px; max-width:500px; margin:auto; }
    button { padding:10px; margin:10px; }
    li { margin:10px; }
  </style>
</head>
<body>

<div class="box">
  <h2>📂 File Public</h2>

  <button onclick="goWA()">📢 Saluran Krammz</button>

  <ul id="list"></ul>

  <hr>

  <h3>🔐 Upload</h3>
  <input type="password" id="pass" placeholder="Password">
  <br>
  <input type="file" id="file" style="display:none;">
  <br>
  <button onclick="login()">Unlock</button>
  <button onclick="upload()" id="btn" style="display:none;">Upload</button>
</div>

<script>
const PASSWORD = "12345";
let unlocked = false;
let files = JSON.parse(localStorage.getItem('files')) || [];

function goWA() {
  window.location.href = "https://whatsapp.com/channel/0029Vb1emh39Gv7QRTZwp02u";
}

function login() {
  if (document.getElementById('pass').value === PASSWORD) {
    unlocked = true;
    document.getElementById('file').style.display = 'block';
    document.getElementById('btn').style.display = 'inline-block';
    alert('Upload kebuka!');
  } else {
    alert('Password salah!');
  }
}

async function upload() {
  if (!unlocked) return alert('Login dulu!');

  const file = document.getElementById('file').files[0];
  if (!file) return alert('Pilih file!');

  const formData = new FormData();
  formData.append('reqtype', 'fileupload');
  formData.append('fileToUpload', file);

  const res = await fetch('https://catbox.moe/user/api.php', {
    method: 'POST',
    body: formData
  });

  const link = await res.text();

  files.push({ name: file.name, url: link });
  localStorage.setItem('files', JSON.stringify(files));

  render();
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  files.forEach(f => {
    const li = document.createElement('li');
    li.innerHTML = `${f.name} - <a href=\"${f.url}\" target=\"_blank\">Download</a>`;
    list.appendChild(li);
  });
}

render();
</script>

</body>
</html>
