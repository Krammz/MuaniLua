<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelajahi File - MUANI</title>

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:sans-serif;
    }

    body {
      background:#0a0a0a;
      color:#fff;
      padding:20px;
    }

    h1 {
      color:#ff2d2d;
      text-align:center;
      margin-bottom:20px;
    }

    .top-bar {
      text-align:center;
      margin-bottom:20px;
    }

    .btn {
      padding:10px 20px;
      background:#ff2d2d;
      border:none;
      color:#fff;
      border-radius:20px;
      cursor:pointer;
      text-decoration:none;
      box-shadow:0 0 10px #ff2d2d;
      display:inline-block;
    }

    .btn.secondary {
      background:#222;
    }

    .file-list {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap:15px;
    }

    .file-card {
      background:#111;
      padding:15px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(255,45,45,0.2);
      text-align:center;
    }

    .file-name {
      margin-bottom:10px;
      font-size:14px;
      word-break:break-all;
    }

    .empty {
      text-align:center;
      opacity:0.6;
      margin-top:40px;
    }
  </style>
</head>

<body>

<h1>Jelajahi File</h1>

<div class="top-bar">
  <a href="index.html" class="btn secondary">Kembali</a>
</div>

<div id="fileList" class="file-list"></div>

<div id="emptyState" class="empty" style="display:none;">
  Belum ada file yang diupload
</div>

<script>
function loadFiles(){
  const list = document.getElementById("fileList");
  const empty = document.getElementById("emptyState");

  let stored = JSON.parse(localStorage.getItem("files")) || [];

  list.innerHTML = "";

  if(stored.length === 0){
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  stored.forEach(file => {
    if(!file.name || !file.data) return; // skip error lama

    let div = document.createElement("div");
    div.className = "file-card";

    div.innerHTML = `
      <div class="file-name">${file.name}</div>
      <a href="${file.data}" download="${file.name}" class="btn">Download</a>
    `;

    list.appendChild(div);
  });
}

loadFiles();
</script>

</body>
</html>
