<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizkyseansa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    background: url('https://qu.ax/Gzcj7') center / cover no-repeat fixed;
    display: flex;
    justify-content: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 40px 16px 30px;
    text-align: center;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, #7b5cff, #ff5ca8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    border: 3px solid #fff3;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .bio {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-bottom: 32px;
  }

  .socials a {
    color: #fff;
    text-decoration: none;
    font-size: 28px;
    transition: transform 0.2s;
  }

  .socials a:hover { transform: scale(1.15); }

  .card {
    display: block;
    background: rgba(20, 20, 20, 0.9);
    border-radius: 22px;
    padding: 14px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.2s, background 0.2s;
  }

  .card:hover {
    transform: translateY(-3px);
    background: rgba(35, 35, 35, 0.95);
  }

  .card img {
    width: 100%;
    border-radius: 14px;
    display: block;
    margin-bottom: 14px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 500;
    padding: 4px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="avatar">R</div>
    <h1>Rizkyseansa</h1>
    <p class="bio">Kalau kau order bisa PM aja ya ♿🎉</p>

    <div class="socials">
      <a href="https://whatsapp.com/channel/0029Vb1emh39Gv7QRTZwp02u" target="_blank" title="WhatsApp">💬</a>
      <a href="#" title="TikTok">🎵</a>
      <a href="#" title="YouTube">▶️</a>
    </div>

    <a class="card" href="https://whatsapp.com/channel/0029Vb1emh39Gv7QRTZwp02u" target="_blank">
      <img src="https://qu.ax/Gzcj7" alt="WhatsApp">
      <div class="card-title">WhatsApp</div>
    </a>
  </div>
</body>
</html>
