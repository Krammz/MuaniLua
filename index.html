<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public File List + Private Upload</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; text-align:center; padding:40px; }
    .container { background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); max-width:500px; margin:auto; }
    input, button { margin:10px 0; padding:10px; }
    button { background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0056b3; }
    ul { list-style:none; padding:0; }
    li { background:#eee; margin:10px 0; padding:10px; border-radius:5px; display:flex; justify-content:space-between; }
  </style>
</head>
<body><div class="container">
  <h2>Daftar File (Public)</h2>
  <ul id="fileList"></ul>  <hr>  <h3>Upload File (Private)</h3>
  <input type="password" id="password" placeholder="Masukkan Password">
  <br>
  <input type="file" id="fileInput" style="display:none;">
  <br>
  <button onclick="login()">Unlock Upload</button>
  <button onclick="uploadFile()" id="uploadBtn" style="display:none;">Upload File</button>
</div><script>
  const ADMIN_PASSWORD = "12345"; // GANTI PASSWORD

  let files = JSON.parse(localStorage.getItem('myFiles')) || [];
  let isUnlocked = false;

  function login() {
    const pass = document.getElementById('password').value;

    if (pass === ADMIN_PASSWORD) {
      isUnlocked = true;
      alert('Upload terbuka!');

      document.getElementById('fileInput').style.display = 'block';
      document.getElementById('uploadBtn').style.display = 'inline-block';
    } else {
      alert('Password salah!');
    }
  }

  function uploadFile() {
    if (!isUnlocked) {
      alert('Harus login dulu!');
      return;
    }

    const input = document.getElementById('fileInput');
    const file = input.files[0];

    if (!file) {
      alert('Pilih file dulu!');
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const fileData = {
        name: file.name,
        url: e.target.result
      };

      files.push(fileData);
      localStorage.setItem('myFiles', JSON.stringify(files));

      renderFiles();
    };

    reader.readAsDataURL(file);
  }

  function renderFiles() {
    const list = document.getElementById('fileList');
    list.innerHTML = '';

    files.forEach(file => {
      const li = document.createElement('li');

      const name = document.createElement('span');
      name.textContent = file.name;

      const link = document.createElement('a');
      link.href = file.url;
      link.download = file.name;
      link.textContent = 'Download';

      li.appendChild(name);
      li.appendChild(link);
      list.appendChild(li);
    });
  }

  // langsung tampilkan file saat halaman dibuka (public)
  renderFiles();
</script></body>
</html>
