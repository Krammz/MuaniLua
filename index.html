<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Upload & Download</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; text-align:center; padding:40px; }
    .container { background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); max-width:500px; margin:auto; }
    input, button { margin:10px 0; padding:10px; }
    button { background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0056b3; }
    ul { list-style:none; padding:0; }
    li { background:#eee; margin:10px 0; padding:10px; border-radius:5px; display:flex; justify-content:space-between; }
  </style>
</head>
<body><div class="container" id="loginBox">
  <h2>Login Admin</h2>
  <input type="password" id="password" placeholder="Masukkan Password">
  <br>
  <button onclick="login()">Login</button>
</div><div class="container" id="app" style="display:none;">
  <h2>Upload File (Private)</h2>
  <input type="file" id="fileInput">
  <br>
  <button onclick="uploadFile()">Upload</button>  <h3>Daftar File</h3>
  <ul id="fileList"></ul>
</div><script>
  const ADMIN_PASSWORD = "12345"; // GANTI PASSWORD DI SINI

  // Ambil file dari localStorage biar gak hilang saat refresh
  let files = JSON.parse(localStorage.getItem('myFiles')) || [];

  function login() {
    const pass = document.getElementById('password').value;

    if (pass === ADMIN_PASSWORD) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderFiles();
    } else {
      alert('Password salah!');
    }
  }

  function uploadFile() {
    const input = document.getElementById('fileInput');
    const file = input.files[0];

    if (!file) {
      alert('Pilih file dulu!');
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const fileData = {
        name: file.name,
        url: e.target.result
      };

      files.push(fileData);

      // Simpan ke localStorage
      localStorage.setItem('myFiles', JSON.stringify(files));

      renderFiles();
    };

    reader.readAsDataURL(file);
  }

  function renderFiles() {
    const list = document.getElementById('fileList');
    list.innerHTML = '';

    files.forEach((file, index) => {
      const li = document.createElement('li');

      const name = document.createElement('span');
      name.textContent = file.name;

      const link = document.createElement('a');
      link.href = file.url;
      link.download = file.name;
      link.textContent = 'Download';

      li.appendChild(name);
      li.appendChild(link);
      list.appendChild(li);
    });
  }
</script></body>
</html>
