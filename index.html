<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUANI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:Poppins;
    background:#050b16;
    color:white;
}

/* LOGIN */
#login {
    display:flex;
    height:100vh;
    justify-content:center;
    align-items:center;
}

.login-box {
    background:#0a1a2f;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px #00ffae;
}

input, select, textarea {
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:none;
    background:#081420;
    color:white;
}

button {
    margin-top:15px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#00ffae;
    cursor:pointer;
}

/* MAIN */
#app { display:none; }

/* SIDEBAR */
.sidebar {
    position:fixed;
    width:220px;
    height:100%;
    background:#0a1a2f;
    padding:20px;
}

.sidebar a {
    display:block;
    margin:10px 0;
    color:white;
    text-decoration:none;
}

/* CONTENT */
.content {
    margin-left:240px;
    padding:20px;
}

/* CARD */
.card {
    background:#0a1a2f;
    padding:20px;
    border-radius:15px;
    margin-top:10px;
    box-shadow:0 0 10px rgba(0,255,174,0.2);
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:10px;
}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-box">
        <h2>Login MUANI</h2>
        <input type="password" id="pass" placeholder="Masukkan Password">
        <button onclick="login()">Masuk</button>
    </div>
</div>

<!-- APP -->
<div id="app">

<div class="sidebar">
    <h3>MUANI</h3>
    <a href="#" onclick="showPage('home')">Home</a>
    <a href="#" onclick="showPage('koleksi')">Koleksi</a>
    <a href="#" onclick="showPage('upload')">Upload</a>
</div>

<div class="content">

<!-- HOME -->
<div id="home">
    <h1>Selamat Datang di MUANI</h1>
    <p>Klik menu untuk mulai</p>
</div>

<!-- KOLEKSI -->
<div id="koleksi" style="display:none;">
    <h2>Jelajahi Koleksi</h2>
    <div id="list" class="grid"></div>
</div>

<!-- UPLOAD -->
<div id="upload" style="display:none;">
    <h2>Upload Script / Mod</h2>

    <input id="nama" placeholder="Nama">
    <input id="versi" placeholder="Versi">
    <input id="author" placeholder="Author">
    <input id="link" placeholder="Link Download">
    <textarea id="desk" placeholder="Deskripsi"></textarea>

    <button onclick="upload()">Upload</button>
</div>

</div>
</div>

<script>

// LOGIN
function login(){
    let p = document.getElementById("pass").value;
    if(p === "121"){
        document.getElementById("login").style.display="none";
        document.getElementById("app").style.display="block";
        loadData();
    } else {
        alert("Password salah!");
    }
}

// NAV
function showPage(page){
    document.getElementById("home").style.display="none";
    document.getElementById("koleksi").style.display="none";
    document.getElementById("upload").style.display="none";

    document.getElementById(page).style.display="block";
}

// UPLOAD
function upload(){
    let data = {
        nama: nama.value,
        versi: versi.value,
        author: author.value,
        link: link.value,
        desk: desk.value
    };

    let db = JSON.parse(localStorage.getItem("muani")) || [];
    db.push(data);
    localStorage.setItem("muani", JSON.stringify(db));

    alert("Berhasil upload!");
    loadData();
}

// LOAD DATA
function loadData(){
    let list = document.getElementById("list");
    list.innerHTML="";

    let db = JSON.parse(localStorage.getItem("muani")) || [];

    db.forEach(item=>{
        list.innerHTML += `
        <div class="card">
            <h3>${item.nama}</h3>
            <p>${item.desk}</p>
            <small>Versi: ${item.versi}</small><br>
            <small>By: ${item.author}</small><br>
            <a href="${item.link}" target="_blank">Download</a>
        </div>
        `;
    });
}

</script>

</body>
</html>
