<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrammzLua Share</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#ffe642;--g:#5fdc3e;--k:#111;--w:#fff;--cr:#fff5a8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--k);background:var(--y);
background-image:radial-gradient(#0002 2px,transparent 2px);background-size:26px 26px;min-height:100vh}
.bang{font-family:'Bangers','Impact',sans-serif;letter-spacing:2px}
#loader{position:fixed;inset:0;z-index:99;background:var(--y);background-image:radial-gradient(#0003 3px,transparent 3px);background-size:22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:.4s}
#loader.out{opacity:0;transform:scale(1.4);pointer-events:none}
.burst{width:260px;height:260px;display:grid;place-items:center;background:var(--g);border:6px solid var(--k);
clip-path:polygon(50% 0,60% 18%,80% 6%,78% 28%,100% 30%,86% 48%,100% 66%,78% 70%,82% 92%,60% 82%,50% 100%,40% 82%,18% 92%,22% 70%,0 66%,14% 48%,0 30%,22% 28%,20% 6%,40% 18%);animation:pulse .5s infinite alternate}
.burst span{font-size:110px;color:var(--w);text-shadow:5px 5px 0 var(--k),-3px -3px 0 var(--k),3px -3px 0 var(--k),-3px 3px 0 var(--k);transform:rotate(-6deg)}
@keyframes pulse{to{transform:scale(1.08) rotate(3deg)}}
.lt{font-size:34px;text-shadow:3px 3px 0 var(--w)}
.bar{width:260px;height:26px;border:4px solid var(--k);background:var(--w);box-shadow:5px 5px 0 var(--k);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .9s linear}
header{background:var(--w);border-bottom:4px solid var(--k);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo b{width:44px;height:44px;display:grid;place-items:center;background:var(--g);border:3px solid var(--k);border-radius:10px;font-size:26px;box-shadow:3px 3px 0 var(--k)}
.tag{background:var(--k);color:var(--y);font-size:11px;padding:3px 8px;border-radius:6px;transform:rotate(-4deg)}
.btn{font-family:inherit;font-weight:700;font-size:16px;border:3px solid var(--k);border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--k);color:var(--w);box-shadow:4px 4px 0 #0007;transition:.1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #0007}
.btn.g{background:var(--g);color:var(--k)}
.hdr-r{display:flex;gap:10px;align-items:center;font-weight:700}
main{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(40px,10vw,64px);line-height:1;text-shadow:4px 4px 0 var(--w)}
.sub{margin:6px 0 18px;font-weight:700}
.search{display:flex;gap:10px;align-items:center;background:var(--w);border:4px solid var(--k);border-radius:14px;padding:12px 16px;box-shadow:6px 6px 0 var(--k);margin-bottom:18px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:18px;background:none}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:inherit;font-weight:700;border:3px solid var(--k);background:var(--w);border-radius:30px;padding:9px 18px;cursor:pointer}
.chip.on{background:var(--k);color:var(--w)}
.count{display:inline-block;border:3px solid var(--k);background:var(--w);border-radius:30px;padding:8px 18px;font-weight:700;margin-bottom:16px}
.card{background:var(--w);border:4px solid var(--k);border-radius:14px;box-shadow:7px 7px 0 var(--k);margin-bottom:22px;overflow:hidden;animation:pop .35s both}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.row{display:flex}
.ext{background:var(--cr);border-right:4px solid var(--k);padding:14px;display:grid;place-items:center;min-width:92px}
.ext span{background:var(--g);border:3px solid var(--k);border-radius:10px;padding:12px 8px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--k);text-transform:uppercase}
.info{padding:14px 16px;flex:1;min-width:0}
.info h3{font-size:22px;word-break:break-all}
.info p{color:#555;margin:4px 0 10px;word-break:break-word}
.meta{display:flex;justify-content:space-between;color:#444;font-weight:700;font-size:15px}
.acts{display:flex;border-top:4px solid var(--k)}
.acts a{flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:18px;padding:14px;background:var(--g);color:var(--k)}
.acts a:active{filter:brightness(.85)}
.empty{text-align:center;padding:30px;font-size:30px}
.wa{background:var(--g);border:4px solid var(--k);border-radius:14px;padding:26px 18px;box-shadow:7px 7px 0 var(--k);margin-top:30px}
.wa h2{font-size:clamp(34px,8vw,48px);line-height:1;margin-bottom:16px}
.wa a{display:block;text-align:center;text-decoration:none;background:var(--k);color:var(--w);font-weight:700;font-size:20px;padding:18px;border-radius:14px;border:3px solid var(--k)}
.exts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:26px 0 8px}
.exts span{background:var(--y);border:3px solid var(--k);border-radius:10px;padding:6px 14px;font-weight:700;box-shadow:3px 3px 0 var(--k)}
footer{text-align:center;font-weight:700;padding:18px;border-top:4px solid var(--k);background:var(--y)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.box{background:var(--w);border:5px solid var(--k);border-radius:18px;box-shadow:9px 9px 0 var(--k);padding:22px;width:100%;max-width:420px;animation:pop .3s}
.box h2{font-size:38px;margin-bottom:12px}
.box input,.box select,.box textarea{width:100%;font:inherit;border:3px solid var(--k);border-radius:10px;padding:11px;margin-bottom:12px;background:var(--cr)}
.box textarea{font-family:monospace;font-size:12px;height:90px;resize:none}
.drop{display:block;border:4px dashed var(--k);border-radius:12px;padding:20px;text-align:center;font-weight:700;margin-bottom:12px;background:var(--cr);cursor:pointer}
.box .btns{display:flex;gap:10px}.box .btns .btn{flex:1}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--k);color:var(--y);padding:12px 22px;border-radius:12px;font-weight:700;z-index:90;transition:.3s;border:3px solid var(--y);max-width:90%;text-align:center}
#toast.on{transform:translateX(-50%)}
</style>
</head>
<body>

<div id="loader">
  <div class="burst"><span class="bang" id="num">1</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="lt bang">LOADING...</div>
</div>

<header>
  <div class="logo"><b class="bang">K</b>KRAMMZLUA <span class="tag">SHARE</span></div>
  <div class="hdr-r">
    <span id="adm" style="display:none">ADMIN</span>
    <button class="btn g" id="upBtn" style="display:none">+ Upload</button>
    <button class="btn" id="loginBtn">Masuk</button>
  </div>
</header>

<main>
  <h1 class="bang">Download file komunitas.</h1>
  <div class="sub"><span id="total">0</span> file tersedia</div>
  <div class="search">🔍<input id="q" placeholder="Cari nama file"></div>
  <div class="chips" id="chips"></div>
  <div class="count" id="cnt">0 file</div>
  <div id="list"></div>

  <div class="wa">
    <h2 class="bang">File baru masuk lewat channel WhatsApp.</h2>
    <a href="https://whatsapp.com/channel/0029Vb1emh39Gv7QRTZwp02u" target="_blank" rel="noopener">💬 Gabung channel</a>
  </div>
  <div class="exts"><span>.lua</span><span>.cs</span><span>.luac</span><span>.zip</span><span>.dll</span><span>.cleo</span><span>.asi</span><span>.csi</span><span>.lib</span><span>.apk</span><span>.rar</span><span>.7z</span></div>
</main>
<footer>© 2026 KrammzLua Share</footer>

<div class="modal" id="mLogin"><div class="box">
  <h2 class="bang">Login Admin</h2>
  <input id="u" placeholder="Username" autocomplete="off">
  <input id="p" type="password" placeholder="Password">
  <div class="btns"><button class="btn" id="cancelL">Batal</button><button class="btn g" id="doLogin">Masuk</button></div>
</div></div>

<div class="modal" id="mUp"><div class="box">
  <h2 class="bang">Tambah File</h2>
  <label class="drop" for="file" id="dropT">📁 Pilih file (maks 2 MB)</label>
  <input type="file" id="file" style="display:none">
  <input id="desc" placeholder="Deskripsi (contoh: /bmbot fitur lengkap)">
  <select id="cat">
    <option>MonetLoader</option><option>GTA SA-MP</option><option>CLEO</option><option>Tools</option><option>Lainnya</option>
  </select>
  <textarea id="out" readonly placeholder="Baris siap tempel muncul di sini"></textarea>
  <div class="btns"><button class="btn" id="cancelU">Tutup</button><button class="btn g" id="doUp">Buat & Salin</button></div>
</div></div>

<div id="toast"></div>

<script>
const ADMIN={u:'krammz',p:'apa123'};

/* ===== DAFTAR FILE =====
   Tempel baris hasil "Buat & Salin" di sini, lalu deploy ulang.
   Baris yang punya data:"..." tersimpan di HTML (tanpa folder files/).
   Baris tanpa data akan mengambil dari folder files/namafile */
const FILES=[
 {name:"contoh.lua",size:2048,date:1760000000000,desc:"Contoh file (hapus baris ini)",cat:"MonetLoader"},
];
/* ======================= */

const CATS=['Semua','MonetLoader','GTA SA-MP','CLEO','Tools','Lainnya'];
const MAX=2*1024*1024;
let isAdmin=sessionStorage.getItem('adm')==='1',cat='Semua';
const items=[...FILES].sort((a,b)=>b.date-a.date);
const $=id=>document.getElementById(id);
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)};

(function(){let n=1;const f=$('fill'),num=$('num');
 setTimeout(()=>f.style.width='20%',50);
 const t=setInterval(()=>{n++;if(n>5){clearInterval(t);$('loader').classList.add('out');setTimeout(()=>$('loader').remove(),500);return}
  num.textContent=n;f.style.width=(n*20)+'%'},1000);})();

const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(1)+' KB';
const dt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
 const q=$('q').value.toLowerCase();
 const list=items.filter(i=>(cat==='Semua'||i.cat===cat)&&i.name.toLowerCase().includes(q));
 $('total').textContent=items.length;
 $('cnt').textContent=list.length+' file';
 $('list').innerHTML=list.length?'':'<div class="empty bang">Belum ada file 💥</div>';
 list.forEach(i=>{
  const ext=(i.name.split('.').pop()||'file');
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="row"><div class="ext"><span>${esc(ext)}</span></div>
  <div class="info"><h3>${esc(i.name)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:'<p>&nbsp;</p>'}
  <div class="meta"><span>${fmt(i.size)}</span><span>${dt(i.date)}</span></div></div></div>
  <div class="acts"><a href="#" data-n="${esc(i.name)}">Download</a></div>`;
  $('list').appendChild(c);
 });
}

/* download: dari data tersimpan di HTML, atau dari folder files/ */
$('list').addEventListener('click',async e=>{
 const a=e.target.closest('[data-n]');if(!a)return;
 e.preventDefault();
 const i=items.find(v=>v.name===a.dataset.n);if(!i)return;
 if(!i.data){location.href='files/'+encodeURIComponent(i.name);return}
 try{
  const b=await (await fetch(i.data)).blob();
  const l=document.createElement('a');
  l.href=URL.createObjectURL(b);l.download=i.name;
  document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(l.href),10000);
  toast('Mengunduh '+i.name);
 }catch(err){toast('Gagal download')}
});

$('chips').innerHTML=CATS.map(c=>`<button class="chip ${c==='Semua'?'on':''}">${c}</button>`).join('');
$('chips').addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 cat=b.textContent;
 [...$('chips').children].forEach(x=>x.classList.toggle('on',x===b));
 render();
});
$('q').addEventListener('input',render);

function adminUI(){
 $('upBtn').style.display=isAdmin?'':'none';
 $('adm').style.display=isAdmin?'':'none';
 $('loginBtn').textContent=isAdmin?'Keluar':'Masuk';
}
$('loginBtn').onclick=()=>{
 if(isAdmin){isAdmin=false;sessionStorage.removeItem('adm');adminUI();toast('Logout');return}
 $('mLogin').classList.add('on');
};
$('cancelL').onclick=()=>$('mLogin').classList.remove('on');
$('doLogin').onclick=()=>{
 if($('u').value===ADMIN.u&&$('p').value===ADMIN.p){
  isAdmin=true;sessionStorage.setItem('adm','1');
  $('mLogin').classList.remove('on');$('u').value=$('p').value='';
  adminUI();toast('Login berhasil 💥');
 }else toast('Akun salah!');
};
$('upBtn').onclick=()=>$('mUp').classList.add('on');
$('cancelU').onclick=()=>$('mUp').classList.remove('on');
$('file').onchange=e=>{
 const f=e.target.files[0];
 $('dropT').textContent=f?'✅ '+f.name+' ('+fmt(f.size)+')':'📁 Pilih file (maks 2 MB)';
 $('out').value='';
};

/* pembuat baris FILES (isi file ikut tersimpan sebagai base64) */
$('doUp').onclick=()=>{
 const f=$('file').files[0];
 if(!f)return toast('Pilih file dulu');
 if(f.size>MAX)return toast('Maksimal 2 MB');
 const r=new FileReader();
 r.onerror=()=>toast('Gagal baca file');
 r.onload=async()=>{
  const line='{name:'+JSON.stringify(f.name)+',size:'+f.size+',date:'+Date.now()+
   ',desc:'+JSON.stringify($('desc').value.trim())+',cat:'+JSON.stringify($('cat').value)+
   ',data:'+JSON.stringify(r.result)+'},';
  const o=$('out');
  try{
   await navigator.clipboard.writeText(line);
   o.value=line.slice(0,200)+'...';
   toast('Tersalin! Tempel ke FILES 💥');
  }catch(e){
   o.readOnly=false;o.value=line;o.focus();o.select();
   let ok=false;try{ok=document.execCommand('copy')}catch(x){}
   o.readOnly=true;
   toast(ok?'Tersalin! Tempel ke FILES 💥':'Salin manual dari kotak');
  }
 };
 r.readAsDataURL(f);
};

document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
render();adminUI();
</script>
</body>
</html>
