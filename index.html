<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUANI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif;}

body {
  background:#0a0a0a;
  color:#fff;
  display:flex;
}

/* SIDEBAR */
.sidebar {
  width:220px;
  background:#111;
  height:100vh;
  padding:20px;
  border-right:2px solid #ff2d2d;
}

.sidebar h2 {
  color:#ff2d2d;
  margin-bottom:15px;
}

.file-list {
  margin-top:10px;
}

.file-item {
  background:#222;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:14px;
}

/* MAIN */
.main {
  flex:1;
  padding:20px;
  text-align:center;
}

.logo {
  width:140px;
  height:140px;
  border-radius:50%;
  margin:20px auto;
  background:url('logo.jpg') center/cover;
  border:3px solid #ff2d2d;
  box-shadow:0 0 25px #ff2d2d;
}

h1 { color:#ff2d2d; }

.hero {
  background:rgba(255,45,45,0.1);
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

.btn {
  padding:10px 20px;
  background:#ff2d2d;
  border:none;
  color:#fff;
  border-radius:20px;
  cursor:pointer;
  margin:5px;
}

/* hidden input */
#fileInput {
  display:none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>📂 Jelajahi</h2>
  <div class="file-list" id="fileList"></div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="logo"></div>
  <h1>MUANI</h1>
  <p>Komunitas Modder & Scripter SAMP Indonesia</p>

  <div class="hero">
    <h2>Selamat Datang</h2>
    <p>Upload dan kelola file kamu di sini</p>

    <button class="btn" onclick="document.getElementById('fileInput').click()">
      Upload File
    </button>

    <input type="file" id="fileInput">
  </div>

</div>

<script>
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");

// Load dari localStorage
let files = JSON.parse(localStorage.getItem("files")) || [];

// render list
function renderFiles() {
  fileList.innerHTML = "";
  files.forEach(f => {
    let div = document.createElement("div");
    div.className = "file-item";
    div.textContent = f;
    fileList.appendChild(div);
  });
}

// saat upload
fileInput.addEventListener("change", function() {
  const file = fileInput.files[0];
  if (!file) return;

  files.push(file.name);

  localStorage.setItem("files", JSON.stringify(files));

  renderFiles();
});

// init
renderFiles();
</script>

</body>
</html>
